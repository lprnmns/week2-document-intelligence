name: document-intelligence-service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/document_intelligence_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/document_intelligence_service/pyproject.toml
      - name: Install service and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app eval tests
      - name: Mypy
        run: mypy app eval
      - name: Service, contract and security tests
        run: pytest -q -m "not integration"
      - name: Frozen evaluation and metadata manifest smoke
        run: |
          python -m eval.run_security_evaluation --help
          test -f ../../data/evaluations/week2_final_corpus_snapshot_v1.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("../../data/evaluations/week2_final_corpus_snapshot_v1.json")
          snapshot = json.loads(path.read_text(encoding="utf-8"))
          assert snapshot["point_count"] == 26
          assert len(snapshot["point_ids"]) == 26
          PY

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build -f projects/document_intelligence_service/Dockerfile -t week2-document-intelligence:ci .
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --strict --progress-spinner off || true
      - name: Secret-pattern scan of tracked source
        run: |
          ! git grep -nE '(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|Authorization: Bearer)' -- ':!*.lock' ':!.github/workflows/document-intelligence-service.yml'
