[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "Production-minded document intelligence and RAG service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "pypdf",
    "python-multipart",
    "qdrant-client",
    "sentence-transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: requires an external local dependency such as Qdrant",
]
